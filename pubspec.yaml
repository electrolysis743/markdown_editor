name: wysiwyg_markdown_editor
description: >-
  An extensible WYSIWYG Markdown editor for Flutter with in-place styling, a
  live preview and fully replaceable commands, builders and syntax rules.
version: 0.2.2
# Open source under GPL-3.0. See LICENSE.
repository: https://github.com/electrolysis743/markdown_editor
# homepage: https://github.com/electrolysis743/markdown_editor
environment:
  sdk: ^3.4.0
  flutter: ">=3.27.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - markdown
  - editor
  - wysiwyg
  - widgets
  - text

screenshots:
  - description: >-
      WYSIWYG Markdown editing: syntax markers are dimmed, headings, quotes,
      code blocks, lists and links are styled in place.
    path: doc/images/editor.png
  - description: >-
      Split view: the editing surface and the flutter_markdown_plus preview
      share the same theme.
    path: doc/images/split.png

flutter:
  # This package ships no assets. Markdown rendering of remote images is
  # delegated to the host application through MarkdownEditorBuilders.imageBuilder.
